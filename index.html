<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>動画アーカイブ</title><style>:root{--bg:#f5f3f8;--text:#28232e;--muted:#7b7285;--line:#e5deeb;--accent:#73549b;--soft:#efe8f7}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text)}header{background:#302638;color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}h1{font-size:18px;margin:0}.small{font-size:12px;color:var(--muted)}header .small{color:#cfc4da}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 70px)}aside{background:#fff;border-right:1px solid var(--line);padding:16px 12px}.nav{width:100%;padding:12px;border:0;border-radius:10px;background:transparent;text-align:left;margin-bottom:5px;cursor:pointer}.nav.active{background:var(--soft);color:#5e3e86;font-weight:700}main{padding:24px;min-width:0}.page{display:none}.page.active{display:block}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}h2{margin:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:14px}.stat{padding:15px}.num{font-size:28px;font-weight:800}.panel{padding:15px;margin-bottom:15px}.filters,.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.filters{grid-template-columns:2fr repeat(4,1fr)}.full{grid-column:1/-1}input,select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff;font:inherit}.btn{border:0;border-radius:9px;padding:9px 13px;background:var(--accent);color:#fff;cursor:pointer}.btn.alt{background:#fff;color:var(--accent);border:1px solid var(--line)}.btn.danger{background:#a94c60}.btn.sm{padding:6px 10px;font-size:12px;white-space:nowrap}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;font-size:12px;min-width:1180px}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:#faf8fb;color:var(--muted);position:sticky;top:0}.sortable{cursor:pointer;user-select:none}.sortable:hover{background:var(--soft);color:var(--accent)}.opcol{position:sticky;right:0;background:#fff;box-shadow:-3px 0 5px #0000000b}.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:var(--soft);color:#60477b}.ok{background:#e6f1e8;color:#3e6d49}.no{background:#f7e5e9;color:#913d51}.candidate{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;cursor:pointer}.candidate:hover{background:var(--soft)}dialog{border:0;border-radius:16px;padding:0;width:min(650px,92vw);box-shadow:0 20px 70px #0005}dialog::backdrop{background:#0007}.modal{padding:22px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}.nav{min-width:max-content;margin:0 4px}.stats{grid-template-columns:1fr 1fr}.filters,.formgrid{grid-template-columns:1fr}.full{grid-column:1}main{padding:12px}}</style></head><body><header><div><h1>動画アーカイブ管理</h1><div class="small">Web Ver.1.9 · グループ別TimeTree対応</div></div><button class="btn alt" onclick="backup()">バックアップ</button></header><div class="layout"><aside><button class="nav active" data-p="videos">🎞 動画一覧</button><button class="nav" data-p="importer">📥 新規動画取り込み</button><button class="nav" data-p="queue">💿 未円盤化</button><button class="nav" data-p="discs">📚 ディスク一覧</button></aside><main><section id="videos" class="page active"><div class="top"><h2>動画一覧</h2><span id="loadStatus" class="small">読込中…</span></div><div class="stats"><div class="stat"><span class="small">登録動画</span><div id="sAll" class="num">-</div></div><div class="stat"><span class="small">円盤化済み</span><div id="sDone" class="num">-</div></div><div class="stat"><span class="small">未円盤化</span><div id="sYet" class="num">-</div></div><div class="stat"><span class="small">TimeTree予定</span><div id="sTT" class="num">-</div></div></div><div class="panel filters"><input id="search" placeholder="検索"><select id="groupfilter"><option value="">全グループ</option><option>永遠のセツナ</option><option>&amp;youth!</option><option>Serenade</option><option>MellBell</option><option>その他</option></select><select id="year"><option value="">すべての年</option><option>2026</option><option>2025</option></select><select id="kind"><option value="">すべての種類</option><option>ライブ映像</option><option>推しカメ</option><option>じじカメラ</option><option>その他</option></select><select id="discfilter"><option value="">円盤状態すべて</option><option value="未">未円盤化</option><option value="済">円盤化済み</option></select></div><div class="tablewrap"><table><thead><tr><th>#</th><th class="sortable" data-sort="group">グループ</th><th class="sortable" data-sort="date">日付</th><th class="sortable" data-sort="filename">ファイル名</th><th class="sortable" data-sort="content">内容</th><th class="sortable" data-sort="place">会場</th><th class="sortable" data-sort="kind">種類</th><th class="sortable" data-sort="disc">円盤</th><th class="opcol">操作</th></tr></thead><tbody id="rows"></tbody></table></div></section><section id="importer" class="page"><h2>新規動画取り込み</h2><div class="panel"><div class="formgrid"><label class="full">動画ファイル<input id="batchFiles" type="file" multiple accept="video/*,.mov,.mp4,.m4v,.mts,.avi"></label><label>グループ<select id="batchGroup"><option>永遠のセツナ</option><option>&amp;youth!</option><option>Serenade</option><option>MellBell</option><option>その他</option></select></label><label>撮影日<input id="batchDate" type="date"></label><label>動画種類<select id="batchKind"><option>ライブ映像</option><option>推しカメ</option><option>じじカメラ</option><option>その他</option></select></label><div class="full"><button class="btn" onclick="lookupTT()">TimeTreeからこの日のライブを探す</button> <span id="ttStatus" class="small"></span></div><div id="ttCandidates" class="full"></div><label class="full">ライブ名<input id="batchEvent"></label><label>会場<input id="batchPlace" list="venueList"><datalist id="venueList"></datalist></label><label>保存場所<input id="batchStorage"></label><div class="full"><button class="btn" onclick="registerBatch()">未円盤化として一括登録</button></div></div></div></section><section id="queue" class="page"><h2>未円盤化</h2><div class="tablewrap"><table><thead><tr><th>グループ</th><th>日付</th><th>ファイル</th><th>内容</th><th class="opcol">操作</th></tr></thead><tbody id="queueRows"></tbody></table></div></section><section id="discs" class="page"><h2>ディスク一覧</h2><div id="discList" class="panel"></div></section></main></div><dialog id="editDialog"><div class="modal"><h2>動画を編集</h2><div class="formgrid" style="margin-top:16px"><label>グループ<select id="eGroup"><option>永遠のセツナ</option><option>&amp;youth!</option><option>Serenade</option><option>MellBell</option><option>その他</option></select></label><label>日付<input id="eDate" type="date"></label><label>種類<select id="eKind"><option>ライブ映像</option><option>推しカメ</option><option>じじカメラ</option><option>その他</option></select></label><label class="full">ファイル名<input id="eFile"></label><label class="full">ライブ名・内容<input id="eContent"></label><label>会場<input id="ePlace" list="venueList"></label><label>保存場所<input id="eStorage"></label><label class="full">DISC名 <span class="small">空欄＝未円盤化</span><input id="eDisc"></label></div><div class="actions"><button class="btn danger" onclick="deleteCurrent()">削除</button><button class="btn alt" onclick="editDialog.close()">キャンセル</button><button class="btn" onclick="saveEdit()">保存</button></div></div></dialog><script>let videos=[],baseVideos=[],ttEvents=[],editing=null,sortKey='date',sortDir=-1;const $=id=>document.getElementById(id);const GROUPS=['永遠のセツナ','&youth!','Serenade','MellBell','その他'];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function getJson(p){let r=await fetch(p+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(p+' '+r.status);return r.json()}function localAdded(){try{return JSON.parse(localStorage.getItem('setsuna-added')||'[]')}catch{return[]}}function overrides(){try{return JSON.parse(localStorage.getItem('setsuna-overrides')||'{}')}catch{return{}}}function deleted(){try{return JSON.parse(localStorage.getItem('setsuna-deleted')||'[]')}catch{return[]}}function legacyKey(v){return[v.sourceSheet||'local',v.sourceNo??'',v.filename||'',v.date||''].join('|')}function stableKey(v){if(v._key)return v._key;if(v.sourceSheet&&v.sourceNo!==undefined&&v.sourceNo!==null&&v.sourceNo!=='')return 'base|'+v.sourceSheet+'|'+v.sourceNo;return legacyKey(v)}function migrateStorage(){let local=localAdded(),changed=false;local=local.map((v,i)=>{if(v._key)return v;changed=true;return{...v,_key:'local|'+Date.now().toString(36)+'|'+i+'|'+Math.random().toString(36).slice(2,9)}});if(changed)localStorage.setItem('setsuna-added',JSON.stringify(local));let old=overrides(),neo={};for(let [k,p] of Object.entries(old)){let b=baseVideos.find(v=>legacyKey(v)===k),nk=b?stableKey(b):k;neo[nk]=p}if(JSON.stringify(old)!==JSON.stringify(neo))localStorage.setItem('setsuna-overrides',JSON.stringify(neo));let ds=deleted().map(k=>{let b=baseVideos.find(v=>legacyKey(v)===k);return b?stableKey(b):k});localStorage.setItem('setsuna-deleted',JSON.stringify([...new Set(ds)]))}function inferGroup(v){let d=String(v.disc||'').toLowerCase(),g=String(v.group||'').trim();if(d.includes('sere'))return'Serenade';if(d.includes('youth'))return'&youth!';if(/mell\s*bell/i.test(d)||d.includes('mellbell'))return'MellBell';if(/(^|[^a-z])etc([^a-z]|$)/i.test(d))return'その他';if(GROUPS.includes(g)&&g!=='永遠のセツナ')return g;return'永遠のセツナ'}function rebuild(){let ov=overrides(),del=new Set(deleted());videos=[...baseVideos,...localAdded()].filter(v=>!del.has(stableKey(v))).map(v=>{let x={...v,...(ov[stableKey(v)]||{})};x._key=stableKey(v);x.group=x.groupEdited&&GROUPS.includes(x.group)?x.group:inferGroup(x);return x});refreshVenues();render()}function refreshVenues(){let saved=[];try{saved=JSON.parse(localStorage.getItem('setsuna-venues')||'[]')}catch{}let a=[...videos.map(v=>v.place),...ttEvents.map(e=>e.location_name),...saved].map(x=>String(x||'').trim()).filter(Boolean);$('venueList').innerHTML=[...new Set(a)].sort((a,b)=>a.localeCompare(b,'ja')).map(v=>`<option value="${esc(v)}"></option>`).join('')}function saveVenue(v){v=String(v||'').trim();if(!v)return;let a=[];try{a=JSON.parse(localStorage.getItem('setsuna-venues')||'[]')}catch{}if(!a.includes(v)){a.push(v);localStorage.setItem('setsuna-venues',JSON.stringify(a))}}async function load(){let p=await Promise.all(['2026','2025','other'].map(n=>getJson('./data/videos-'+n+'.json')));baseVideos=p.flat();migrateStorage();try{let d=await getJson('./data/timetree-events.json');ttEvents=Array.isArray(d)?d:(d.events||[])}catch{}$('loadStatus').textContent=`既存 ${baseVideos.length}件 読込完了`;rebuild()}document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav,.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.p).classList.add('active')});['search','groupfilter','year','kind','discfilter'].forEach(id=>$(id).oninput=renderRows);document.querySelectorAll('.sortable').forEach(th=>th.onclick=()=>{let k=th.dataset.sort;if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=1}renderRows()});function filtered(){let q=$('search').value.toLowerCase(),g=$('groupfilter').value,y=$('year').value,k=$('kind').value,d=$('discfilter').value;let a=videos.filter(v=>(!q||[v.group,v.filename,v.content,v.place,v.disc].join(' ').toLowerCase().includes(q))&&(!g||v.group===g)&&(!y||(v.date||'').startsWith(y))&&(!k||v.kind===k)&&(!d||(d==='済'?!!v.disc:!v.disc)));return a.sort((x,y)=>String(x[sortKey]??'').localeCompare(String(y[sortKey]??''),'ja',{numeric:true})*sortDir)}function render(){$('sAll').textContent=videos.length;$('sDone').textContent=videos.filter(v=>v.disc).length;$('sYet').textContent=videos.filter(v=>!v.disc).length;$('sTT').textContent=ttEvents.length;renderRows();renderQueue();renderDiscs()}function editButton(v,label='編集'){return `<button class="btn sm edit-btn" data-key="${esc(stableKey(v))}">${label}</button>`}function renderRows(){document.querySelectorAll('.sortable').forEach(th=>{let label={group:'グループ',date:'日付',filename:'ファイル名',content:'内容',place:'会場',kind:'種類',disc:'円盤'}[th.dataset.sort];th.textContent=label+(sortKey===th.dataset.sort?(sortDir===1?' ▲':' ▼'):'')});$('rows').innerHTML=filtered().map((v,i)=>`<tr><td>${i+1}</td><td><span class="badge">${esc(v.group)}</span></td><td>${esc(v.date)}</td><td>${esc(v.filename)}</td><td>${esc(v.content)}</td><td>${esc(v.place)}</td><td>${esc(v.kind)}</td><td>${v.disc?`<span class="badge ok">${esc(v.disc)}</span>`:'<span class="badge no">未</span>'}</td><td class="opcol">${editButton(v)}</td></tr>`).join('')}function renderQueue(){$('queueRows').innerHTML=videos.filter(v=>!v.disc).map(v=>`<tr><td>${esc(v.group)}</td><td>${esc(v.date)}</td><td>${esc(v.filename)}</td><td>${esc(v.content)}</td><td class="opcol">${editButton(v,'編集・円盤化')}</td></tr>`).join('')}document.addEventListener('click',e=>{let b=e.target.closest('.edit-btn');if(b)openEdit(b.dataset.key)});function renderDiscs(){let m={};videos.filter(v=>v.disc).forEach(v=>(m[v.disc]??=[]).push(v));$('discList').innerHTML=Object.entries(m).sort().map(([d,a])=>`<div style="padding:8px"><b>💿 ${esc(d)}</b> <span class="small">${[...new Set(a.map(v=>v.group))].map(esc).join(' / ')} · ${a.length}ファイル</span></div>`).join('')}function openEdit(k){let v=videos.find(x=>stableKey(x)===k);if(!v)return;editing={k,v};$('eGroup').value=v.group||'永遠のセツナ';$('eDate').value=v.date||'';$('eKind').value=v.kind||'ライブ映像';$('eFile').value=v.filename||'';$('eContent').value=v.content||'';$('ePlace').value=v.place||'';$('eStorage').value=v.storage||'';$('eDisc').value=v.disc||'';$('editDialog').showModal()}function saveEdit(){if(!editing)return;let patch={group:$('eGroup').value,groupEdited:true,date:$('eDate').value,kind:$('eKind').value,filename:$('eFile').value.trim(),content:$('eContent').value.trim(),place:$('ePlace').value.trim(),storage:$('eStorage').value.trim(),disc:$('eDisc').value.trim()};saveVenue(patch.place);let local=localAdded(),i=local.findIndex(v=>stableKey(v)===editing.k);if(i>=0){local[i]={...local[i],...patch,_key:editing.k};localStorage.setItem('setsuna-added',JSON.stringify(local))}else{let o=overrides();o[editing.k]={...(o[editing.k]||{}),...patch};localStorage.setItem('setsuna-overrides',JSON.stringify(o))}$('editDialog').close();rebuild()}function deleteCurrent(){if(!editing||!confirm('この動画を削除する？'))return;let local=localAdded(),i=local.findIndex(v=>stableKey(v)===editing.k);if(i>=0){local.splice(i,1);localStorage.setItem('setsuna-added',JSON.stringify(local))}else{let d=deleted();if(!d.includes(editing.k))d.push(editing.k);localStorage.setItem('setsuna-deleted',JSON.stringify(d))}$('editDialog').close();rebuild()}function jstDate(x){let d=(typeof x==='number'||/^\d{12,13}$/.test(String(x)))?new Date(Number(x)):new Date(x);if(isNaN(d.getTime()))return String(x||'').slice(0,10);return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}function normalizeEvent(e){return{title:e.title||'',date:jstDate(e.start_at),location:e.location_name||'',address:e.location_address||'',group:e._group||'永遠のセツナ',calendarId:e._calendar_id||'setsuna'}}function lookupTT(){let date=$('batchDate').value,group=$('batchGroup').value;if(!date)return alert('先に撮影日を入れてな');if(group==='その他'){window._hits=[];$('ttStatus').textContent='その他はTimeTree連携なし';$('ttCandidates').innerHTML='';return}let hits=ttEvents.map(normalizeEvent).filter(e=>e.date===date&&e.group===group);window._hits=hits;$('ttStatus').textContent=hits.length?`${group}で${hits.length}件見つかった`:`${group}のこの日の予定なし`;$('ttCandidates').innerHTML=hits.map((e,i)=>`<div class="candidate" onclick="chooseTT(${i})"><b>${esc(e.title)}</b><div class="small">${esc(e.location||e.address||'会場情報なし')}</div></div>`).join('');if(hits.length===1)chooseTT(0)}function chooseTT(i){let e=window._hits[i];$('batchEvent').value=e.title;$('batchPlace').value=e.location||e.address||'';saveVenue($('batchPlace').value)}function inferDate(n){let m=String(n).match(/(?:^|[^0-9])(0?[1-9]|1[0-2])([0-3][0-9])(?:[^0-9]|$)/);return m?`2026-${String(+m[1]).padStart(2,'0')}-${String(+m[2]).padStart(2,'0')}`:''}$('batchFiles').onchange=()=>{let f=[...$('batchFiles').files];if(f.length&&!$('batchDate').value)$('batchDate').value=inferDate(f[0].name)};$('batchGroup').onchange=()=>{$('ttStatus').textContent='';$('ttCandidates').innerHTML='';$('batchEvent').value='';$('batchPlace').value=''};function registerBatch(){let fs=[...$('batchFiles').files],date=$('batchDate').value;if(!fs.length||!date)return alert('ファイルと日付を入れてな');let local=localAdded(),place=$('batchPlace').value.trim();saveVenue(place);fs.forEach((f,i)=>local.push({_key:'local|'+Date.now().toString(36)+'|'+i+'|'+Math.random().toString(36).slice(2,9),group:$('batchGroup').value,groupEdited:true,date,filename:f.name,content:$('batchEvent').value.trim(),place,kind:$('batchKind').value,disc:'',storage:$('batchStorage').value.trim(),sizeGB:(f.size/1073741824).toFixed(2)+'GB'}));localStorage.setItem('setsuna-added',JSON.stringify(local));alert(fs.length+'件登録したで');location.reload()}function backup(){let b=new Blob([JSON.stringify({videos,added:localAdded(),overrides:overrides(),deleted:deleted()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='video-archive-backup.json';a.click()}load().catch(e=>{$('loadStatus').textContent='読込エラー: '+e.message});</script></body></html>
