<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>永遠のセツナ 動画アーカイブ</title><style>:root{--bg:#f5f3f8;--card:#fff;--text:#28232e;--muted:#7b7285;--line:#e5deeb;--accent:#73549b;--soft:#efe8f7;--ok:#4e7d5a;--danger:#a94c60}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text)}header{height:64px;background:#302638;color:#fff;padding:0 24px;display:flex;align-items:center;justify-content:space-between}h1{font-size:18px;margin:0}.small{font-size:12px;color:var(--muted)}header .small{color:#cfc4da}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 64px)}aside{background:#fff;border-right:1px solid var(--line);padding:16px 12px}.nav{width:100%;padding:12px;border:0;border-radius:10px;background:transparent;text-align:left;margin-bottom:5px;cursor:pointer}.nav.active{background:var(--soft);color:#5e3e86;font-weight:700}main{padding:24px;min-width:0}.page{display:none}.page.active{display:block}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}h2{margin:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:14px}.stat{padding:15px}.num{font-size:28px;font-weight:800;margin-top:4px}.panel{padding:15px;margin-bottom:15px}.filters{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:9px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff;font:inherit}button{font:inherit}.btn{border:0;border-radius:9px;padding:9px 13px;background:var(--accent);color:#fff;cursor:pointer}.btn.alt{background:#fff;color:var(--accent);border:1px solid var(--line)}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;font-size:12px;min-width:1050px}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:#faf8fb;color:var(--muted)}.sortable{cursor:pointer}.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:var(--soft);color:#60477b;white-space:nowrap}.ok{background:#e6f1e8;color:#3e6d49}.no{background:#f7e5e9;color:#913d51}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.candidate{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;cursor:pointer}.candidate:hover,.candidate.selected{background:var(--soft)}@media(max-width:900px){header{height:auto;padding:14px}.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}.nav{min-width:max-content;margin:0 4px}.stats{grid-template-columns:1fr 1fr}.filters,.formgrid{grid-template-columns:1fr}.full{grid-column:1}}</style></head><body><header><div><h1>永遠のセツナ 動画アーカイブ管理</h1><div class="small">Web Ver.1 · TimeTree自動照合</div></div><button class="btn alt" onclick="backup()">バックアップ</button></header><div class="layout"><aside><button class="nav active" data-p="videos">🎞 動画一覧</button><button class="nav" data-p="importer">📥 新規動画取り込み</button><button class="nav" data-p="queue">💿 未円盤化</button><button class="nav" data-p="discs">📚 ディスク一覧</button></aside><main><section id="videos" class="page active"><div class="top"><h2>動画一覧</h2></div><div class="stats"><div class="stat"><span class="small">登録動画</span><div id="sAll" class="num">-</div></div><div class="stat"><span class="small">円盤化済み</span><div id="sDone" class="num">-</div></div><div class="stat"><span class="small">未円盤化</span><div id="sYet" class="num">-</div></div><div class="stat"><span class="small">TimeTree予定</span><div id="sTT" class="num">-</div></div></div><div class="panel filters"><input id="search" placeholder="ファイル名・内容・会場・DISCで検索"><select id="year"><option value="">すべての年</option><option>2026</option><option>2025</option></select><select id="kind"><option value="">すべての種類</option><option>ライブ映像</option><option>推しカメ</option><option>じじカメラ</option><option>その他</option></select><select id="discfilter"><option value="">円盤状態すべて</option><option value="未">未円盤化</option><option value="済">円盤化済み</option></select></div><div class="tablewrap"><table><thead><tr><th>#</th><th class="sortable" onclick="sortBy('date')">日付 ↕</th><th class="sortable" onclick="sortBy('filename')">ファイル名 ↕</th><th>内容</th><th>会場</th><th>種類</th><th>円盤</th></tr></thead><tbody id="rows"></tbody></table></div></section><section id="importer" class="page"><div class="top"><div><h2>新規動画取り込み</h2><div class="small">動画本体は送信せず、ファイル名・容量・更新日時だけ読み取ります。</div></div></div><div class="panel"><div class="formgrid"><label class="full">① 動画ファイルを選択（複数可）<input id="batchFiles" type="file" multiple accept="video/*,.mov,.mp4,.m4v,.mts,.avi"></label><label>② 撮影日<input id="batchDate" type="date"></label><label>動画種類<select id="batchKind"><option>ライブ映像</option><option>推しカメ</option><option>じじカメラ</option><option>その他</option></select></label><div class="full"><button class="btn" onclick="lookupTT()">TimeTreeからこの日のライブを探す</button> <span id="ttStatus" class="small"></span></div><div id="ttCandidates" class="full"></div><label class="full">ライブ名<input id="batchEvent"></label><label>会場<input id="batchPlace"></label><label>元データ保存場所<input id="batchStorage" placeholder="例：外付けHDD / 2026年8月"></label><div class="full"><button class="btn" onclick="registerBatch()">未円盤化として一括登録</button></div></div></div></section><section id="queue" class="page"><div class="top"><h2>未円盤化</h2></div><div class="tablewrap"><table><thead><tr><th>日付</th><th>ファイル名</th><th>ライブ</th><th>会場</th><th>容量</th></tr></thead><tbody id="queueRows"></tbody></table></div></section><section id="discs" class="page"><div class="top"><h2>ディスク一覧</h2></div><div id="discList" class="panel"></div></section></main></div><script>let videos=[],ttEvents=[],sortKey='date',sortDir=1;const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(){const parts=await Promise.all(['2026','2025','other'].map(n=>fetch('./data/videos-'+n+'.json').then(r=>r.json())));const base=parts.flat().map((v,i)=>({...v,id:i+1}));const local=JSON.parse(localStorage.getItem('setsuna-added')||'[]');videos=[...base,...local];try{const d=await fetch('./data/timetree-events.json?'+Date.now()).then(r=>r.json());ttEvents=Array.isArray(d)?d:(d.events||[])}catch(e){ttEvents=[]}render()}document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.p).classList.add('active')});['search','year','kind','discfilter'].forEach(id=>$(id).oninput=renderRows);function filtered(){let q=$('search').value.toLowerCase(),y=$('year').value,k=$('kind').value,d=$('discfilter').value;let a=videos.filter(v=>(!q||[v.filename,v.content,v.place,v.disc].join(' ').toLowerCase().includes(q))&&(!y||(v.date||'').startsWith(y))&&(!k||v.kind===k)&&(!d||(d==='済'?!!v.disc:!v.disc)));a.sort((a,b)=>String(a[sortKey]||'').localeCompare(String(b[sortKey]||''),'ja',{numeric:true})*sortDir);return a}function sortBy(k){if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=1}renderRows()}function render(){sAll.textContent=videos.length;sDone.textContent=videos.filter(v=>v.disc).length;sYet.textContent=videos.filter(v=>!v.disc).length;sTT.textContent=ttEvents.length;renderRows();renderQueue();renderDiscs()}function renderRows(){rows.innerHTML=filtered().map((v,i)=>`<tr><td>${i+1}</td><td>${esc(v.date)}</td><td>${esc(v.filename)}</td><td>${esc(v.content)}</td><td>${esc(v.place)}</td><td><span class="badge">${esc(v.kind)}</span></td><td>${v.disc?`<span class="badge ok">${esc(v.disc)}</span>`:'<span class="badge no">未</span>'}</td></tr>`).join('')}function renderQueue(){queueRows.innerHTML=videos.filter(v=>!v.disc).sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(v=>`<tr><td>${esc(v.date)}</td><td>${esc(v.filename)}</td><td>${esc(v.content)}</td><td>${esc(v.place)}</td><td>${esc(v.sizeGB||'')}</td></tr>`).join('')}function renderDiscs(){let m={};videos.filter(v=>v.disc).forEach(v=>(m[v.disc]??=[]).push(v));discList.innerHTML=Object.entries(m).sort().map(([d,a])=>`<div style="padding:10px;border-bottom:1px solid var(--line)"><b>💿 ${esc(d)}</b><div class="small">${a.length}ファイル</div></div>`).join('')}function jstDate(x){if(!x)return'';let d=new Date(x);if(isNaN(d))return String(x).slice(0,10);return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}function normalizeEvent(e){e=e.public_event||e.event||e;let loc=e.location_name||e.location?.name||e.location||e.place||'';if(typeof loc==='object')loc=loc.name||loc.address||'';return{title:e.title||e.name||'',date:jstDate(e.start_at||e.startAt||e.start_date||e.startDate),location:loc,address:e.location_address||e.location?.address||''}}function lookupTT(){let date=batchDate.value;if(!date){alert('先に撮影日を入れてな');return}let hits=ttEvents.map(normalizeEvent).filter(e=>e.date===date);window._hits=hits;ttStatus.textContent=hits.length?hits.length+'件見つかった':'この日の予定なし';ttCandidates.innerHTML=hits.map((e,i)=>`<div class="candidate" onclick="chooseTT(${i})"><b>${esc(e.title)}</b><div class="small">${esc(e.location||e.address||'会場情報なし')}</div></div>`).join('');if(hits.length===1)chooseTT(0)}function chooseTT(i){let e=window._hits[i];batchEvent.value=e.title;batchPlace.value=e.location||e.address||'';document.querySelectorAll('.candidate').forEach((x,n)=>x.classList.toggle('selected',n===i))}function inferDate(name){let m=String(name).match(/(?:^|[^0-9])(0?[1-9]|1[0-2])([0-3][0-9])(?:[^0-9]|$)/);return m?`2026-${String(+m[1]).padStart(2,'0')}-${String(+m[2]).padStart(2,'0')}`:''}batchFiles.onchange=()=>{let fs=[...batchFiles.files];if(fs.length&&!batchDate.value)batchDate.value=inferDate(fs[0].name);ttStatus.textContent=fs.length+'ファイル選択中'}function registerBatch(){let fs=[...batchFiles.files];if(!fs.length||!batchDate.value){alert('ファイルと日付を入れてな');return}let local=JSON.parse(localStorage.getItem('setsuna-added')||'[]');fs.forEach(f=>local.push({date:batchDate.value,filename:f.name,content:batchEvent.value.trim(),place:batchPlace.value.trim(),kind:batchKind.value,disc:'',storage:batchStorage.value.trim(),sizeGB:(f.size/1024/1024/1024).toFixed(2)+'GB',lastModified:new Date(f.lastModified).toISOString(),group:'永遠のセツナ'}));localStorage.setItem('setsuna-added',JSON.stringify(local));alert(fs.length+'件登録したで');location.reload()}function backup(){let blob=new Blob([JSON.stringify({videos,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='setsuna-video-backup.json';a.click()}load();</script></body></html>
