<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>動画アーカイブ</title>
<style>
:root{--bg:#f5f3f8;--text:#28232e;--muted:#7b7285;--line:#e5deeb;--accent:#73549b;--soft:#efe8f7;--disc-width:220px}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text)}
header{background:#302638;color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:18px;margin:0}.small{font-size:12px;color:var(--muted)}header .small{color:#cfc4da}
.layout{display:grid;grid-template-columns:160px 1fr;min-height:calc(100vh - 70px)}
aside{background:#fff;border-right:1px solid var(--line);padding:12px 8px}
.nav{width:100%;padding:10px 8px;border:0;border-radius:10px;background:transparent;text-align:left;margin-bottom:5px;cursor:pointer;white-space:nowrap}
.nav.active{background:var(--soft);color:#5e3e86;font-weight:700}
main{padding:24px;min-width:0}.page{display:none}.page.active{display:block}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}h2{margin:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:14px}.stat{padding:15px}.num{font-size:28px;font-weight:800}.panel{padding:15px;margin-bottom:15px}
.filters,.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.filters{grid-template-columns:2fr repeat(4,1fr)}.full{grid-column:1/-1}
input,select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff;font:inherit}
.btn{border:0;border-radius:9px;padding:9px 13px;background:var(--accent);color:#fff;cursor:pointer}.btn.alt{background:#fff;color:var(--accent);border:1px solid var(--line)}.btn.danger{background:#a94c60}.btn.sm{padding:6px 10px;font-size:12px;white-space:nowrap}
.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px}.resizable-table{width:auto;min-width:100%;table-layout:fixed}table{width:100%;border-collapse:collapse;font-size:12px;min-width:1180px}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;overflow-wrap:anywhere}
th{background:#faf8fb;color:var(--muted);position:sticky;top:0;z-index:3}.sortable{cursor:pointer;user-select:none}.sortable:hover{background:var(--soft);color:var(--accent)}
.opcol{position:sticky;right:0;background:#fff;box-shadow:-3px 0 5px #0000000b;z-index:5;min-width:80px}
.disccol{position:sticky;right:80px;background:#fff;box-shadow:-3px 0 5px #00000008;z-index:4}
.kindcol{position:sticky;right:calc(80px + var(--disc-width));background:#fff;box-shadow:-3px 0 5px #00000006;z-index:3}
th.disccol,th.kindcol{background:#faf8fb;z-index:6}
.selected-row .kindcol,.selected-row .disccol,.selected-row .opcol{background:#faf7fd}
.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:var(--soft);color:#60477b}.ok{background:#e6f1e8;color:#3e6d49}.no{background:#f7e5e9;color:#913d51}
.candidate{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;cursor:pointer}.candidate:hover{background:var(--soft)}
dialog{border:0;border-radius:16px;padding:0;width:min(650px,92vw);box-shadow:0 20px 70px #0005}dialog::backdrop{background:#0007}.modal{padding:22px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.bulkbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.bulkbar .count{font-weight:700;color:var(--accent)}.selectcell{width:36px;text-align:center}.rowcheck,.headcheck,.queuecheck,.queueheadcheck{width:auto}.bulkfield{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:center}.bulkfield input[type=checkbox]{width:auto}.bulkfield label{margin:0}.selected-row{background:#faf7fd}
.resize-handle{position:absolute;top:0;right:-4px;width:8px;height:100%;cursor:col-resize;z-index:7}.resize-handle:hover,.resize-handle.active{background:#73549b33}body.col-resizing{cursor:col-resize;user-select:none}
@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}.nav{min-width:max-content;margin:0 4px}.stats{grid-template-columns:1fr 1fr}.filters,.formgrid{grid-template-columns:1fr}.full{grid-column:1}main{padding:12px}}
</style>
</head>
<body>
<header><div><h1>動画アーカイブ管理</h1><div class="small">Web Ver.2.8 · 内容列コンパクト / Shift範囲選択 / 種類列固定 / 重複ファイル名チェック / 未円盤化DISC一括設定 / 一括編集 / 列幅変更 / DISC固定</div></div><button class="btn alt" onclick="backup()">バックアップ</button></header>
<div class="layout">
<aside><button class="nav active" data-p="videos">🎞 動画一覧</button><button class="nav" data-p="importer">📥 新規動画取り込み</button><button class="nav" data-p="queue">💿 未円盤化</button><button class="nav" data-p="discs">📚 ディスク一覧</button></aside>
<main>
<section id="videos" class="page active">
<div class="top"><h2>動画一覧</h2><span id="loadStatus" class="small">読込中…</span></div>
<div class="stats"><div class="stat"><span class="small">登録動画</span><div id="sAll" class="num">-</div></div><div class="stat"><span class="small">円盤化済み</span><div id="sDone" class="num">-</div></div><div class="stat"><span class="small">未円盤化</span><div id="sYet" class="num">-</div></div><div class="stat"><span class="small">TimeTree予定</span><div id="sTT" class="num">-</div></div></div>
<div class="panel filters"><input id="search" placeholder="検索"><select id="groupfilter"><option value="">全グループ</option><option>永遠のセツナ</option><option>&youth!</option><option>Serenade</option><option>MellBell</option><option>その他</option></select><select id="year"><option value="">すべての年</option><option>2026</option><option>2025</option></select><select id="kind"><option value="">すべての種類</option><option>ライブ映像</option><option>推しカメ</option><option>じじカメラ</option><option>その他</option></select><select id="discfilter"><option value="">円盤状態すべて</option><option value="未">未円盤化</option><option value="済">円盤化済み</option></select></div>
<div class="bulkbar"><button class="btn alt sm" onclick="selectVisible()">表示中を全選択</button><button class="btn alt sm" onclick="clearSelection()">選択解除</button><span class="count"><span id="selectedCount">0</span>件選択中</span><button id="bulkEditBtn" class="btn sm" onclick="openBulkEdit()" disabled>まとめて編集</button><button class="btn alt sm" onclick="resetColumnWidths()">列幅リセット</button><span class="small">見出しの右端をドラッグで列幅変更</span></div>
<div class="tablewrap"><table id="videoTable" class="resizable-table"><colgroup><col data-col="select" style="width:42px"><col data-col="no" style="width:50px"><col data-col="group" style="width:120px"><col data-col="date" style="width:110px"><col data-col="filename" style="width:170px"><col data-col="content" style="width:130px"><col data-col="place" style="width:180px"><col data-col="kind" style="width:100px"><col data-col="disc" style="width:220px"><col data-col="ops" style="width:80px"></colgroup><thead><tr><th class="selectcell"><input id="headCheck" class="headcheck" type="checkbox" aria-label="表示中を全選択"></th><th>#</th><th class="sortable" data-sort="group">グループ</th><th class="sortable" data-sort="date">日付</th><th class="sortable" data-sort="filename">ファイル名</th><th class="sortable" data-sort="content">内容</th><th class="sortable" data-sort="place">会場</th><th class="sortable kindcol" data-sort="kind">種類</th><th class="sortable disccol" data-sort="disc">円盤</th><th class="opcol">操作</th></tr></thead><tbody id="rows"></tbody></table></div>
</section>
<section id="importer" class="page"><h2>新規動画取り込み</h2><div class="panel"><div class="formgrid"><label class="full">動画ファイル<input id="batchFiles" type="file" multiple accept="video/*,.mov,.mp4,.m4v,.mts,.avi"></label><label>グループ<select id="batchGroup"><option>永遠のセツナ</option><option>&youth!</option><option>Serenade</option><option>MellBell</option><option>その他</option></select></label><label>撮影日<input id="batchDate" type="date"></label><label>動画種類<select id="batchKind"><option>ライブ映像</option><option>推しカメ</option><option>じじカメラ</option><option>その他</option></select></label><div class="full"><button class="btn" onclick="lookupTT()">TimeTreeからこの日のライブを探す</button> <span id="ttStatus" class="small"></span></div><div id="ttCandidates" class="full"></div><label class="full">ライブ名<input id="batchEvent"></label><label>会場<input id="batchPlace" list="venueList"><datalist id="venueList"></datalist></label><label>保存場所<input id="batchStorage"></label><div class="full"><button class="btn" onclick="registerBatch()">未円盤化として一括登録</button></div></div></div></section>
<section id="queue" class="page"><h2>未円盤化</h2><div class="bulkbar" style="margin-top:16px"><button class="btn alt sm" onclick="selectAllQueue()">すべて選択</button><button class="btn alt sm" onclick="clearQueueSelection()">選択解除</button><span class="count"><span id="queueSelectedCount">0</span>件選択中</span><input id="queueDiscName" placeholder="DISC名 例: set2601" style="width:180px"><button id="queueDiscBtn" class="btn sm" onclick="applyQueueDisc()" disabled>DISC名を一括設定</button></div><div class="tablewrap"><table><thead><tr><th class="selectcell"><input id="queueHeadCheck" class="queueheadcheck" type="checkbox" aria-label="未円盤化をすべて選択"></th><th>グループ</th><th>日付</th><th>ファイル</th><th>内容</th><th class="opcol">操作</th></tr></thead><tbody id="queueRows"></tbody></table></div></section>
<section id="discs" class="page"><h2>ディスク一覧</h2><div id="discList" class="panel"></div></section>
</main></div>
<dialog id="editDialog"><div class="modal"><h2>動画を編集</h2><div class="formgrid" style="margin-top:16px"><label>グループ<select id="eGroup"><option>永遠のセツナ</option><option>&youth!</option><option>Serenade</option><option>MellBell</option><option>その他</option></select></label><label>日付<input id="eDate" type="date"></label><label>種類<select id="eKind"><option>ライブ映像</option><option>推しカメ</option><option>じじカメラ</option><option>その他</option></select></label><div class="full"><button type="button" class="btn alt" onclick="lookupEditTT()">TimeTreeからこの日のライブを探す</button> <span id="eTTStatus" class="small"></span></div><div id="eTTCandidates" class="full"></div><label class="full">ファイル名<input id="eFile"></label><label class="full">ライブ名・内容<input id="eContent"></label><label>会場<input id="ePlace" list="venueList"></label><label>保存場所<input id="eStorage"></label><label class="full">DISC名 <span class="small">空欄＝未円盤化</span><input id="eDisc"></label></div><div class="actions"><button class="btn danger" onclick="deleteCurrent()">削除</button><button class="btn alt" onclick="editDialog.close()">キャンセル</button><button class="btn" onclick="saveEdit()">保存</button></div></div></dialog>
<dialog id="bulkDialog"><div class="modal"><h2>まとめて編集</h2><p class="small"><span id="bulkCount">0</span>件に適用します。変更したい項目だけ左のチェックを入れてください。</p><div class="formgrid" style="margin-top:16px"><div class="bulkfield"><input id="useBGroup" type="checkbox"><label>グループ<select id="bGroup"><option>永遠のセツナ</option><option>&youth!</option><option>Serenade</option><option>MellBell</option><option>その他</option></select></label></div><div class="bulkfield"><input id="useBDate" type="checkbox"><label>日付<input id="bDate" type="date"></label></div><div class="bulkfield"><input id="useBKind" type="checkbox"><label>種類<select id="bKind"><option>ライブ映像</option><option>推しカメ</option><option>じじカメラ</option><option>その他</option></select></label></div><div class="bulkfield"><input id="useBPlace" type="checkbox"><label>会場<input id="bPlace" list="venueList"></label></div><div class="bulkfield full"><input id="useBContent" type="checkbox"><label>ライブ名・内容<input id="bContent"></label></div><div class="bulkfield"><input id="useBStorage" type="checkbox"><label>保存場所<input id="bStorage"></label></div><div class="bulkfield"><input id="useBDisc" type="checkbox"><label>DISC名 <span class="small">空欄を適用すると未円盤化</span><input id="bDisc"></label></div></div><div class="actions"><button class="btn alt" onclick="bulkDialog.close()">キャンセル</button><button class="btn" onclick="saveBulkEdit()">選択した項目を適用</button></div></div></dialog>
<script>
let videos=[],baseVideos=[],ttEvents=[],editing=null,sortKey='date',sortDir=-1,lastRowKey=null,lastQueueKey=null;const selected=new Set(),queueSelected=new Set();const $=id=>document.getElementById(id);const GROUPS=['永遠のセツナ','&youth!','Serenade','MellBell','その他'];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[m]));
const COLUMN_DEFAULTS={select:42,no:50,group:120,date:110,filename:170,content:130,place:180,kind:100,disc:220,ops:80};
function columnWidths(){try{return JSON.parse(localStorage.getItem('setsuna-column-widths')||'{}')}catch{return{}}}
function minColumnWidth(k){return k==='disc'?180:(k==='ops'?80:42)}
function applyColumnWidths(widths=columnWidths()){document.querySelectorAll('#videoTable col[data-col]').forEach(c=>{let k=c.dataset.col,w=Number(widths[k]||COLUMN_DEFAULTS[k]||100);c.style.width=Math.max(minColumnWidth(k),w)+'px'});let disc=$('videoTable')?.querySelector('col[data-col="disc"]');if(disc)document.documentElement.style.setProperty('--disc-width',(parseFloat(disc.style.width)||220)+'px');updateTableWidth()}
function updateTableWidth(){let t=$('videoTable');if(!t)return;let total=[...t.querySelectorAll('col[data-col]')].reduce((n,c)=>n+(parseFloat(c.style.width)||100),0);let wrap=t.closest('.tablewrap');t.style.width=Math.max(total,wrap?wrap.clientWidth:total)+'px'}
function saveColumnWidths(){let o={};document.querySelectorAll('#videoTable col[data-col]').forEach(c=>o[c.dataset.col]=Math.round(parseFloat(c.style.width)||COLUMN_DEFAULTS[c.dataset.col]||100));localStorage.setItem('setsuna-column-widths',JSON.stringify(o))}
function resetColumnWidths(){localStorage.removeItem('setsuna-column-widths');applyColumnWidths(COLUMN_DEFAULTS)}
function initColumnResize(){let table=$('videoTable'),ths=[...table.querySelectorAll('thead th')],cols=[...table.querySelectorAll('col[data-col]')];applyColumnWidths();ths.forEach((th,i)=>{if(i<2||i===ths.length-1)return;let h=document.createElement('span');h.className='resize-handle';h.title='ドラッグで列幅変更';h.addEventListener('mousedown',e=>{e.preventDefault();e.stopPropagation();let col=cols[i],key=col.dataset.col,startX=e.clientX,startW=parseFloat(col.style.width)||th.getBoundingClientRect().width;h.classList.add('active');document.body.classList.add('col-resizing');let move=ev=>{col.style.width=Math.max(key==='disc'?180:70,startW+(ev.clientX-startX))+'px';if(key==='disc')document.documentElement.style.setProperty('--disc-width',col.style.width);updateTableWidth()};let up=()=>{document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);h.classList.remove('active');document.body.classList.remove('col-resizing');saveColumnWidths()};document.addEventListener('mousemove',move);document.addEventListener('mouseup',up)});th.appendChild(h)});window.addEventListener('resize',updateTableWidth)}
async function getJson(p){let r=await fetch(p+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(p+' '+r.status);return r.json()}
function localAdded(){try{return JSON.parse(localStorage.getItem('setsuna-added')||'[]')}catch{return[]}}function overrides(){try{return JSON.parse(localStorage.getItem('setsuna-overrides')||'{}')}catch{return{}}}function deleted(){try{return JSON.parse(localStorage.getItem('setsuna-deleted')||'[]')}catch{return[]}}
function legacyKey(v){return[v.sourceSheet||'local',v.sourceNo??'',v.filename||'',v.date||''].join('|')}function stableKey(v){if(v._key)return v._key;if(v.sourceSheet&&v.sourceNo!==undefined&&v.sourceNo!==null&&v.sourceNo!=='')return'base|'+v.sourceSheet+'|'+v.sourceNo;return legacyKey(v)}
function migrateStorage(){let local=localAdded(),changed=false;local=local.map((v,i)=>{if(v._key)return v;changed=true;return{...v,_key:'local|'+Date.now().toString(36)+'|'+i+'|'+Math.random().toString(36).slice(2,9)}});if(changed)localStorage.setItem('setsuna-added',JSON.stringify(local));let old=overrides(),neo={};for(let[k,p]of Object.entries(old)){let b=baseVideos.find(v=>legacyKey(v)===k),nk=b?stableKey(b):k;neo[nk]=p}if(JSON.stringify(old)!==JSON.stringify(neo))localStorage.setItem('setsuna-overrides',JSON.stringify(neo));let ds=deleted().map(k=>{let b=baseVideos.find(v=>legacyKey(v)===k);return b?stableKey(b):k});localStorage.setItem('setsuna-deleted',JSON.stringify([...new Set(ds)]))}
function inferGroup(v){let d=String(v.disc||'').toLowerCase(),g=String(v.group||'').trim();if(d.includes('sere'))return'Serenade';if(d.includes('youth'))return'&youth!';if(/mell\s*bell/i.test(d)||d.includes('mellbell'))return'MellBell';if(/(^|[^a-z])etc([^a-z]|$)/i.test(d))return'その他';if(GROUPS.includes(g)&&g!=='永遠のセツナ')return g;return'永遠のセツナ'}
function rebuild(){let ov=overrides(),del=new Set(deleted());videos=[...baseVideos,...localAdded()].filter(v=>!del.has(stableKey(v))).map(v=>{let x={...v,...(ov[stableKey(v)]||{})};x._key=stableKey(v);x.group=x.groupEdited&&GROUPS.includes(x.group)?x.group:inferGroup(x);return x});for(const k of [...selected])if(!videos.some(v=>stableKey(v)===k))selected.delete(k);for(const k of [...queueSelected])if(!videos.some(v=>stableKey(v)===k&&!v.disc))queueSelected.delete(k);refreshVenues();render()}
function refreshVenues(){let saved=[];try{saved=JSON.parse(localStorage.getItem('setsuna-venues')||'[]')}catch{}let a=[...videos.map(v=>v.place),...ttEvents.map(e=>e.location_name),...saved].map(x=>String(x||'').trim()).filter(Boolean);$('venueList').innerHTML=[...new Set(a)].sort((a,b)=>a.localeCompare(b,'ja')).map(v=>`<option value="${esc(v)}"></option>`).join('')}
function saveVenue(v){v=String(v||'').trim();if(!v)return;let a=[];try{a=JSON.parse(localStorage.getItem('setsuna-venues')||'[]')}catch{}if(!a.includes(v)){a.push(v);localStorage.setItem('setsuna-venues',JSON.stringify(a))}}
async function load(){let p=await Promise.all(['2026','2025','other'].map(n=>getJson('./data/videos-'+n+'.json')));baseVideos=p.flat();migrateStorage();try{let d=await getJson('./data/timetree-events.json');ttEvents=Array.isArray(d)?d:(d.events||[])}catch{}$('loadStatus').textContent=`既存 ${baseVideos.length}件 読込完了`;rebuild()}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav,.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.p).classList.add('active')});['search','groupfilter','year','kind','discfilter'].forEach(id=>$(id).oninput=renderRows);document.querySelectorAll('.sortable').forEach(th=>th.onclick=e=>{if(e.target.closest('.resize-handle'))return;let k=th.dataset.sort;if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=1}renderRows()});
function filtered(){let q=$('search').value.toLowerCase(),g=$('groupfilter').value,y=$('year').value,k=$('kind').value,d=$('discfilter').value;let a=videos.filter(v=>(!q||[v.group,v.filename,v.content,v.place,v.disc].join(' ').toLowerCase().includes(q))&&(!g||v.group===g)&&(!y||(v.date||'').startsWith(y))&&(!k||v.kind===k)&&(!d||(d==='済'?!!v.disc:!v.disc)));return a.sort((x,y)=>String(x[sortKey]??'').localeCompare(String(y[sortKey]??''),'ja',{numeric:true})*sortDir)}
function render(){$('sAll').textContent=videos.length;$('sDone').textContent=videos.filter(v=>v.disc).length;$('sYet').textContent=videos.filter(v=>!v.disc).length;$('sTT').textContent=ttEvents.length;renderRows();renderQueue();renderDiscs();updateTableWidth()}function editButton(v,label='編集'){return`<button class="btn sm edit-btn" data-key="${esc(stableKey(v))}">${label}</button>`}
function renderRows(){document.querySelectorAll('.sortable').forEach(th=>{let label={group:'グループ',date:'日付',filename:'ファイル名',content:'内容',place:'会場',kind:'種類',disc:'円盤'}[th.dataset.sort];let handle=th.querySelector('.resize-handle');th.childNodes[0].textContent=label+(sortKey===th.dataset.sort?(sortDir===1?' ▲':' ▼'):'');if(handle&&!th.contains(handle))th.appendChild(handle)});let list=filtered();$('rows').innerHTML=list.map((v,i)=>{let key=stableKey(v),checked=selected.has(key);return`<tr class="${checked?'selected-row':''}"><td class="selectcell"><input class="rowcheck" type="checkbox" data-key="${esc(key)}" ${checked?'checked':''}></td><td>${i+1}</td><td><span class="badge">${esc(v.group)}</span></td><td>${esc(v.date)}</td><td>${esc(v.filename)}</td><td>${esc(v.content)}</td><td>${esc(v.place)}</td><td class="kindcol">${esc(v.kind)}</td><td class="disccol">${v.disc?`<span class="badge ok">${esc(v.disc)}</span>`:'<span class="badge no">未</span>'}</td><td class="opcol">${editButton(v)}</td></tr>`}).join('');updateBulkUi(list)}
function updateBulkUi(list=filtered()){$('selectedCount').textContent=selected.size;$('bulkEditBtn').disabled=selected.size===0;let visibleKeys=list.map(stableKey),selectedVisible=visibleKeys.filter(k=>selected.has(k)).length;$('headCheck').checked=visibleKeys.length>0&&selectedVisible===visibleKeys.length;$('headCheck').indeterminate=selectedVisible>0&&selectedVisible<visibleKeys.length}
function selectVisible(){filtered().forEach(v=>selected.add(stableKey(v)));renderRows()}function clearSelection(){selected.clear();lastRowKey=null;renderRows()}$('headCheck').onchange=e=>{if(e.target.checked)selectVisible();else{filtered().forEach(v=>selected.delete(stableKey(v)));renderRows()}};
function renderQueue(){let list=videos.filter(v=>!v.disc);$('queueRows').innerHTML=list.map(v=>{let key=stableKey(v),checked=queueSelected.has(key);return`<tr class="${checked?'selected-row':''}"><td class="selectcell"><input class="queuecheck" type="checkbox" data-key="${esc(key)}" ${checked?'checked':''}></td><td>${esc(v.group)}</td><td>${esc(v.date)}</td><td>${esc(v.filename)}</td><td>${esc(v.content)}</td><td class="opcol">${editButton(v,'編集・円盤化')}</td></tr>`}).join('');updateQueueBulkUi(list)}
function updateQueueBulkUi(list=videos.filter(v=>!v.disc)){$('queueSelectedCount').textContent=queueSelected.size;$('queueDiscBtn').disabled=queueSelected.size===0;let keys=list.map(stableKey),n=keys.filter(k=>queueSelected.has(k)).length;$('queueHeadCheck').checked=keys.length>0&&n===keys.length;$('queueHeadCheck').indeterminate=n>0&&n<keys.length}
function selectAllQueue(){videos.filter(v=>!v.disc).forEach(v=>queueSelected.add(stableKey(v)));renderQueue()}function clearQueueSelection(){queueSelected.clear();lastQueueKey=null;renderQueue()}$('queueHeadCheck').onchange=e=>{if(e.target.checked)selectAllQueue();else clearQueueSelection()};
function applyQueueDisc(){let disc=$('queueDiscName').value.trim();if(!queueSelected.size)return;if(!disc)return alert('DISC名を入れてな');if(!confirm(`${queueSelected.size}件に「${disc}」を設定する？`))return;for(const k of queueSelected)applyPatchToKey(k,{disc});queueSelected.clear();$('queueDiscName').value='';rebuild()}
function rangeKeys(selector,fromKey,toKey){let boxes=[...document.querySelectorAll(selector)],a=boxes.findIndex(x=>x.dataset.key===fromKey),b=boxes.findIndex(x=>x.dataset.key===toKey);if(a<0||b<0)return[];return boxes.slice(Math.min(a,b),Math.max(a,b)+1).map(x=>x.dataset.key)}
document.addEventListener('click',e=>{let c=e.target.closest('.rowcheck');if(c){let key=c.dataset.key;if(e.shiftKey&&lastRowKey){let keys=rangeKeys('.rowcheck',lastRowKey,key),on=c.checked;keys.forEach(k=>on?selected.add(k):selected.delete(k));renderRows()}lastRowKey=key;return}let q=e.target.closest('.queuecheck');if(q){let key=q.dataset.key;if(e.shiftKey&&lastQueueKey){let keys=rangeKeys('.queuecheck',lastQueueKey,key),on=q.checked;keys.forEach(k=>on?queueSelected.add(k):queueSelected.delete(k));renderQueue()}lastQueueKey=key;return}let b=e.target.closest('.edit-btn');if(b)openEdit(b.dataset.key)});
document.addEventListener('change',e=>{let c=e.target.closest('.rowcheck');if(c){if(c.checked)selected.add(c.dataset.key);else selected.delete(c.dataset.key);renderRows();return}let q=e.target.closest('.queuecheck');if(q){if(q.checked)queueSelected.add(q.dataset.key);else queueSelected.delete(q.dataset.key);renderQueue()}});
function renderDiscs(){let m={};videos.filter(v=>v.disc).forEach(v=>(m[v.disc]??=[]).push(v));$('discList').innerHTML=Object.entries(m).sort().map(([d,a])=>`<div style="padding:8px"><b>💿 ${esc(d)}</b> <span class="small">${[...new Set(a.map(v=>v.group))].map(esc).join(' / ')} · ${a.length}ファイル</span></div>`).join('')}
function openEdit(k){let v=videos.find(x=>stableKey(x)===k);if(!v)return;editing={k,v};$('eGroup').value=v.group||'永遠のセツナ';$('eDate').value=v.date||'';$('eKind').value=v.kind||'ライブ映像';$('eFile').value=v.filename||'';$('eContent').value=v.content||'';$('ePlace').value=v.place||'';$('eStorage').value=v.storage||'';$('eDisc').value=v.disc||'';$('eTTStatus').textContent='';$('eTTCandidates').innerHTML='';$('editDialog').showModal()}
function applyPatchToKey(k,patch){let local=localAdded(),i=local.findIndex(v=>stableKey(v)===k);if(i>=0){local[i]={...local[i],...patch,_key:k};localStorage.setItem('setsuna-added',JSON.stringify(local))}else{let o=overrides();o[k]={...(o[k]||{}),...patch};localStorage.setItem('setsuna-overrides',JSON.stringify(o))}}
function saveEdit(){if(!editing)return;let patch={group:$('eGroup').value,groupEdited:true,date:$('eDate').value,kind:$('eKind').value,filename:$('eFile').value.trim(),content:$('eContent').value.trim(),place:$('ePlace').value.trim(),storage:$('eStorage').value.trim(),disc:$('eDisc').value.trim()};saveVenue(patch.place);applyPatchToKey(editing.k,patch);$('editDialog').close();rebuild()}
function openBulkEdit(){if(!selected.size)return;$('bulkCount').textContent=selected.size;['useBGroup','useBDate','useBKind','useBContent','useBPlace','useBStorage','useBDisc'].forEach(id=>$(id).checked=false);$('bGroup').value='永遠のセツナ';$('bDate').value='';$('bKind').value='ライブ映像';$('bContent').value='';$('bPlace').value='';$('bStorage').value='';$('bDisc').value='';$('bulkDialog').showModal()}
function saveBulkEdit(){if(!selected.size)return;let patch={};if($('useBGroup').checked){patch.group=$('bGroup').value;patch.groupEdited=true}if($('useBDate').checked)patch.date=$('bDate').value;if($('useBKind').checked)patch.kind=$('bKind').value;if($('useBContent').checked)patch.content=$('bContent').value.trim();if($('useBPlace').checked){patch.place=$('bPlace').value.trim();saveVenue(patch.place)}if($('useBStorage').checked)patch.storage=$('bStorage').value.trim();if($('useBDisc').checked)patch.disc=$('bDisc').value.trim();if(!Object.keys(patch).length)return alert('変更する項目にチェックを入れてな');if(!confirm(`${selected.size}件をまとめて変更する？`))return;for(const k of selected)applyPatchToKey(k,patch);$('bulkDialog').close();selected.clear();rebuild()}
function deleteCurrent(){if(!editing||!confirm('この動画を削除する？'))return;let local=localAdded(),i=local.findIndex(v=>stableKey(v)===editing.k);if(i>=0){local.splice(i,1);localStorage.setItem('setsuna-added',JSON.stringify(local))}else{let d=deleted();if(!d.includes(editing.k))d.push(editing.k);localStorage.setItem('setsuna-deleted',JSON.stringify(d))}$('editDialog').close();rebuild()}
function jstDate(x){let d=(typeof x==='number'||/^\d{12,13}$/.test(String(x)))?new Date(Number(x)):new Date(x);if(isNaN(d.getTime()))return String(x||'').slice(0,10);return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}function normalizeEvent(e){return{title:e.title||'',date:jstDate(e.start_at),location:e.location_name||'',address:e.location_address||'',group:e._group||'永遠のセツナ',calendarId:e._calendar_id||'setsuna'}}function hitsFor(group,date){if(group==='その他')return[];return ttEvents.map(normalizeEvent).filter(e=>e.date===date&&e.group===group)}
function lookupTT(){let date=$('batchDate').value,group=$('batchGroup').value;if(!date)return alert('先に撮影日を入れてな');if(group==='その他'){window._hits=[];$('ttStatus').textContent='その他はTimeTree連携なし';$('ttCandidates').innerHTML='';return}let hits=hitsFor(group,date);window._hits=hits;$('ttStatus').textContent=hits.length?`${group}で${hits.length}件見つかった`:`${group}のこの日の予定なし`;$('ttCandidates').innerHTML=hits.map((e,i)=>`<div class="candidate" onclick="chooseTT(${i})"><b>${esc(e.title)}</b><div class="small">${esc(e.location||e.address||'会場情報なし')}</div></div>`).join('');if(hits.length===1)chooseTT(0)}function chooseTT(i){let e=window._hits[i];$('batchEvent').value=e.title;$('batchPlace').value=e.location||e.address||'';saveVenue($('batchPlace').value)}
function lookupEditTT(){let date=$('eDate').value,group=$('eGroup').value;if(!date)return alert('先に日付を入れてな');if(group==='その他'){window._editHits=[];$('eTTStatus').textContent='その他はTimeTree連携なし';$('eTTCandidates').innerHTML='';return}let hits=hitsFor(group,date);window._editHits=hits;$('eTTStatus').textContent=hits.length?`${group}で${hits.length}件見つかった`:`${group}のこの日の予定なし`;$('eTTCandidates').innerHTML=hits.map((e,i)=>`<div class="candidate" onclick="chooseEditTT(${i})"><b>${esc(e.title)}</b><div class="small">${esc(e.location||e.address||'会場情報なし')}</div></div>`).join('');if(hits.length===1)chooseEditTT(0)}function chooseEditTT(i){let e=window._editHits[i];$('eContent').value=e.title;$('ePlace').value=e.location||e.address||'';saveVenue($('ePlace').value)}$('eGroup').onchange=$('eDate').onchange=()=>{$('eTTStatus').textContent='';$('eTTCandidates').innerHTML=''};
function inferDate(n){let m=String(n).match(/(?:^|[^0-9])(0?[1-9]|1[0-2])([0-3][0-9])(?:[^0-9]|$)/);return m?`2026-${String(+m[1]).padStart(2,'0')}-${String(+m[2]).padStart(2,'0')}`:''}$('batchFiles').onchange=()=>{let f=[...$('batchFiles').files];if(f.length&&!$('batchDate').value)$('batchDate').value=inferDate(f[0].name)};$('batchGroup').onchange=()=>{$('ttStatus').textContent='';$('ttCandidates').innerHTML='';$('batchEvent').value='';$('batchPlace').value=''};
function registerBatch(){let fs=[...$('batchFiles').files],date=$('batchDate').value;if(!fs.length||!date)return alert('ファイルと日付を入れてな');let norm=n=>String(n||'').trim().toLowerCase(),existing=new Set(videos.map(v=>norm(v.filename)).filter(Boolean)),seen=new Set(),duplicates=[],fresh=[];for(const f of fs){let n=norm(f.name);if(!n||existing.has(n)||seen.has(n))duplicates.push(f.name);else{seen.add(n);fresh.push(f)}}if(duplicates.length){let names=[...new Set(duplicates)].map(n=>'・'+n).join('\n'),msg=`すでに登録済み、または今回の選択内で重複しているファイルが${[...new Set(duplicates)].length}件あるで。\n\n${names}\n\n重複を除外して、残り${fresh.length}件だけ登録する？\nOK＝重複を除外して登録 / キャンセル＝登録しない`;if(!confirm(msg))return}if(!fresh.length)return alert('登録できる新しいファイルはなかったで');let local=localAdded(),place=$('batchPlace').value.trim();saveVenue(place);fresh.forEach((f,i)=>local.push({_key:'local|'+Date.now().toString(36)+'|'+i+'|'+Math.random().toString(36).slice(2,9),group:$('batchGroup').value,groupEdited:true,date,filename:f.name,content:$('batchEvent').value.trim(),place,kind:$('batchKind').value,disc:'',storage:$('batchStorage').value.trim(),sizeGB:(f.size/1073741824).toFixed(2)+'GB'}));localStorage.setItem('setsuna-added',JSON.stringify(local));alert(fresh.length+'件登録したで'+(duplicates.length?`（重複${[...new Set(duplicates)].length}件は除外）`:''));location.reload()}
function backup(){let b=new Blob([JSON.stringify({videos,added:localAdded(),overrides:overrides(),deleted:deleted()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='video-archive-backup.json';a.click()}
initColumnResize();load().catch(e=>{$('loadStatus').textContent='読込エラー: '+e.message});
