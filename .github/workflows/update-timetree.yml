name: Update TimeTree events

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_timetree.py'
      - '.github/workflows/update-timetree.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch TimeTree public events
        run: python scripts/fetch_timetree.py
      - name: Commit updated events
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/timetree-events.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update TimeTree events"
            git push
          fi
